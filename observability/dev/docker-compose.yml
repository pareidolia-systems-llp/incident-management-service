name: incident-management-observability-dev

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/config.yml", "-target=all"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    mem_limit: 768m
    cpus: 1.0
    logging: *container-logging

  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:12347:12347"
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      # Relative to this Compose file, ../../logs is the repository's logs directory.
      # Mount the directory so replacement/rotation of the file remains visible.
      - type: bind
        source: ../../logs
        target: /var/log/incident-management
        read_only: true
        bind:
          create_host_path: false
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    mem_limit: 256m
    cpus: 0.5
    logging: *container-logging

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Use Grafana's initial sign-in flow; no credentials are stored here.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki
    mem_limit: 512m
    cpus: 1.0
    logging: *container-logging

volumes:
  loki-data:
  alloy-data:
  grafana-data:
