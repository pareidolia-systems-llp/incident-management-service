spring.application.name=incident-management-service
server.port=${PORT:8080}

# MySQL datasource configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.auth.allowed-domain=${APP_ALLOWED_DOMAIN:pareidolia.in}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.auth.bootstrap-admin-emails=${APP_BOOTSTRAP_ADMIN_EMAILS:}
app.auth.bootstrap-it-handler-emails=${APP_BOOTSTRAP_IT_HANDLER_EMAILS:itadmin@pareidolia.in}
app.default-it-owner=${APP_DEFAULT_IT_OWNER:itadmin@pareidolia.in}

# Incident email is opt-in; production local Postfix requires a second opt-in.
app.notifications.email.enabled=${INCIDENT_EMAIL_ENABLED:false}
# V2 requires approved routing and content decisions; disabled by default.
# Optional for backward compatibility. Set the approved HTTPS frontend origin for portal links.
app.notifications.email.portal-origin=${INCIDENT_EMAIL_PORTAL_ORIGIN:}
app.notifications.email.v2.enabled=${INCIDENT_EMAIL_V2_ENABLED:false}
# Explicitly opt in to routine-form routing without a separate case authority.
app.notifications.email.v2.routine-routing-enabled=${INCIDENT_EMAIL_V2_ROUTINE_ROUTING_ENABLED:false}
# Requires a configured portal origin and either approved routine routing or a trusted case-specific authority.
app.notifications.email.v2.details-enabled=${INCIDENT_EMAIL_V2_DETAILS_ENABLED:false}
app.notifications.email.v2.department-recipients=${INCIDENT_EMAIL_V2_DEPARTMENT_RECIPIENTS:}
app.notifications.email.local-postfix-enabled=${INCIDENT_EMAIL_LOCAL_POSTFIX_ENABLED:false}
app.notifications.email.from=${INCIDENT_EMAIL_FROM:}
app.notifications.email.it-recipients=${INCIDENT_EMAIL_IT_RECIPIENTS:}
app.notifications.email.hr-recipients=${INCIDENT_EMAIL_HR_RECIPIENTS:}
app.notifications.email.dev-allowlist=${INCIDENT_EMAIL_DEV_ALLOWLIST:}
app.notifications.email.smtp.host=${INCIDENT_EMAIL_SMTP_HOST:}
app.notifications.email.smtp.port=${INCIDENT_EMAIL_SMTP_PORT:0}
app.notifications.email.smtp.username=${INCIDENT_EMAIL_SMTP_USERNAME:}
app.notifications.email.smtp.password=${INCIDENT_EMAIL_SMTP_PASSWORD:}
app.notifications.email.smtp.starttls=${INCIDENT_EMAIL_SMTP_STARTTLS:false}

server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# Guarded B4 remains disabled until independently reviewed activation.
app.incident-access.enabled=${INCIDENT_ACCESS_ENABLED:false}
app.incident-assignment.enabled=${INCIDENT_ASSIGNMENT_ENABLED:false}
app.incident-assignment.allowed-actor-handler-pairs=${INCIDENT_ASSIGNMENT_ALLOWED_PAIRS:}

# Separate ISMS/HR-approved subset of capability administrators for global incident viewing.
app.incident-capability-admin.global-view-approver-emails=${INCIDENT_GLOBAL_VIEW_APPROVER_EMAILS:}

# Independent membership administration. Keep disabled until its schema and operators are reviewed.
app.department-membership-admin.enabled=${DEPARTMENT_MEMBERSHIP_ADMIN_ENABLED:false}
app.department-membership-admin.allowed-emails=${DEPARTMENT_MEMBERSHIP_ADMIN_ALLOWED_EMAILS:}

# Transfer remains disabled until the directional routes and access-handoff policy are reviewed.
app.incident-transfer.allowed-coordinator-routes=${INCIDENT_TRANSFER_ALLOWED_COORDINATOR_ROUTES:}
app.incident-transfer.handoff-approved=${INCIDENT_TRANSFER_HANDOFF_APPROVED:false}
